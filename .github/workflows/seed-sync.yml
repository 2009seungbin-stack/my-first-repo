name: Nerulio 2.0 seed sync
# Curated seed edits (data/seed/**) → ingest pipeline → D1 (REST API), after the first load from
# export-sql.mjs. One job per changed vertical (tools/platform/seed-sync.mjs --plan). Safe to repeat:
# an unchanged seed writes ~0 rows and never reverts collector/admin/community data. Off until the
# repository variable PLATFORM_COLLECTORS=on; same secrets as collectors.yml (preview, plus production when
# CF_D1_DATABASE_ID_PROD is set: the seed is synced into each database in turn). See
# NERULIO_2_MIGRATION_PLAN.md §2.
on:
  push:
    branches: [main]
    paths:
      - 'data/seed/**'
  workflow_dispatch:
    inputs:
      verticals:
        description: 'Comma-separated verticals (empty = all): ai,games,hardware,studio,subculture'
        required: false
      radar:
        description: 'Show the changes on the Radar (a curated correction worth announcing)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: seed-sync
  cancel-in-progress: false
jobs:
  plan:
    if: ${{ vars.PLATFORM_COLLECTORS == 'on' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verticals: ${{ steps.plan.outputs.verticals }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # --changed-since diffs against the push's "before" commit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: plan
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_VERTICALS: ${{ github.event.inputs.verticals }}
        run: |
          set --
          if [ -n "$INPUT_VERTICALS" ]; then set -- --verticals "$INPUT_VERTICALS"
          elif [ -n "$BEFORE" ]; then set -- --changed-since "$BEFORE"; fi
          echo "verticals=$(node tools/platform/seed-sync.mjs --plan "$@")" >> "$GITHUB_OUTPUT"
  sync:
    needs: plan
    if: ${{ needs.plan.outputs.verticals != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90   # one vertical per database, the databases one after the other
    strategy:
      fail-fast: false
      max-parallel: 1   # verticals reference each other's entities: one at a time
      matrix:
        vertical: ${{ fromJSON(needs.plan.outputs.verticals) }}
    name: sync (${{ matrix.vertical }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync data/seed/${{ matrix.vertical }} into D1
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_IDS: preview:${{ secrets.CF_D1_DATABASE_ID }}${{ secrets.CF_D1_DATABASE_ID_PROD != '' && format(',prod:{0}', secrets.CF_D1_DATABASE_ID_PROD) || '' }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RADAR: ${{ github.event.inputs.radar }}
          VERTICAL: ${{ matrix.vertical }}
        run: |
          set -- --d1 --verticals "$VERTICAL"
          if [ "$RADAR" = 'true' ]; then set -- "$@" --radar; fi
          node tools/platform/seed-sync.mjs "$@"
  notify:
    # Same channel as collectors.yml: a failed sync → "collector_failed" push to the admin app. A run
    # that recorded "seed-sync-<vertical>" alerts like a collector; one that recorded nothing sends
    # "시드 동기화 워크플로 실패" (label seed-sync). Skipped until NOTIFY_URL / NOTIFY_TOKEN are set.
    needs: [plan, sync]
    if: ${{ always() && needs.plan.result != 'skipped' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify the admin app
        env:
          NOTIFY_URL: ${{ vars.NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NOTIFY_URL" ] || [ -z "$NOTIFY_TOKEN" ]; then echo 'NOTIFY_URL / NOTIFY_TOKEN not set: skipped'; exit 0; fi
          curl -sS -m 30 -o /dev/null -w "notify collector_failed: HTTP %{http_code}\n" -X POST "${NOTIFY_URL%/}/api/v2/admin/notify" \
            -H "authorization: Bearer $NOTIFY_TOKEN" -H 'content-type: application/json' \
            --data "{\"kind\":\"collector_failed\",\"payload\":{\"runUrl\":\"$RUN_URL\",\"label\":\"seed-sync\"}}" || true
