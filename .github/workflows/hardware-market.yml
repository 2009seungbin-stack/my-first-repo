name: Community hardware market
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hardware-market
  cancel-in-progress: false
jobs:
  collect:
    if: ${{ vars.PLATFORM_COLLECTORS == 'on' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect public facts into existing databases
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_IDS: preview:${{ secrets.CF_D1_DATABASE_ID }}${{ secrets.CF_D1_DATABASE_ID_PROD != '' && format(',prod:{0}', secrets.CF_D1_DATABASE_ID_PROD) || '' }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {collectCommunity,SOURCES} from './collectors/_hardware-market/collect.js';
          const results=await collectCommunity({sources:[SOURCES[0]],fetch:async(url,options)=>{
            const response=await fetch(url,options);
            const body=await response.clone().text();
            console.log(JSON.stringify({url,status:response.status,type:response.headers.get('content-type'),length:body.length,title:body.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1],entry:/data-gg-block-kind="entry"/.test(body),document:/class="document_\d+_\d+ xe_content"/.test(body),headings:[...body.matchAll(/<h1\b[^>]*>/gi)].map(m=>m[0]),categories:[...body.matchAll(/<strong\b[^>]*class="cate[^>]*>[\s\S]*?<\/strong>/gi)].map(m=>m[0])}));
            return response;
          }});
          console.log(JSON.stringify(results.map(({source,status,items,excluded,failure})=>({source,status,count:items.length,excluded,failure}))));
          process.exitCode=results.some(r=>r.status!=='ok')?1:0;
          NODE
