name: OAuth regression
on:
  pull_request:
    paths:
      - tests/service-browser.py
      - server/oauth/**
      - src/account-page.js
      - src/signin-brands.js
      - .github/workflows/oauth.yml
permissions:
  contents: read
concurrency:
  group: oauth-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - run: |
          mkdir -p test-results
          for attempt in $(seq 1 8); do
            echo "OAuth regression attempt $attempt/8"
            SERVICE_SCENARIOS=social python tests/service-browser.py > "test-results/social-$attempt.log" 2>&1 || { cat "test-results/social-$attempt.log"; exit 1; }
            tail -n 1 "test-results/social-$attempt.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oauth-regression
          path: test-results/
          retention-days: 7
