<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f7fa"><meta name="description" content="이미지 편집, PDF 페이지 편집, 도트 에셋, 짧은 미디어 편집. 파일을 서버에 업로드하지 않는 {{brand}}."><meta property="og:title" content="{{brand}}"><meta property="og:description" content="Local file tools"><base href="./"><title>{{brand}} — 내 파일의 작은 작업실</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="experience.css"><script type="module" src="src/app.js"></script>
<link rel="stylesheet" href="content.css">
<link rel="stylesheet" href="src/toolkit.css">
</head>
<body>
<header class="app-header"><a class="brand" href="./" aria-label="{{brand}} 홈" data-i18n-aria="shell.home">{{logo}}<strong>{{brand}}<span class="brand-dot">.</span></strong></a><div class="header-end"><label class="language-control"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg><select id="languageSelect" aria-label="Language" data-i18n-aria="language.label"><option value="auto">Auto-detect</option><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option></select></label><span class="local-pill"><span></span><span data-i18n="shell.local">Processed on your device</span></span><a class="account-link" id="accountLink" target="_blank" rel="noopener" hidden></a><button class="icon-button" data-action="help" data-tip="Tool names and help" data-i18n-tip="shell.help" aria-label="도움말" data-i18n-aria="shell.help" id="helpButton"></button></div></header>
<div class="app-layout"><nav class="nav-rail" aria-label="편집기 선택" data-i18n-aria="shell.editors" id="navigation"></nav>
<main class="workspace editor-workspace" data-ad-exclude id="workspace" aria-busy="false"><div class="workspace-header"><div class="workspace-title"><span class="eyebrow" id="editorKicker">YOUR LOCAL STUDIO</span><h1 id="editorTitle">이미지 편집</h1></div><div class="top-actions" id="topActions"></div></div>
<div class="work-body"><section class="stage" id="stage" aria-label="파일 작업 영역" data-i18n-aria="shell.stage"><div id="emptyState" class="empty-state"><div id="intentIcon" class="intent-icon" hidden></div><button id="dropButton" class="drop-button" data-action="open" aria-label="파일 선택" data-i18n-aria="shell.open"><span class="stack-back"></span><span class="stack-front"><svg viewBox="0 0 80 64" aria-hidden="true"><rect x="1" y="1" width="78" height="62" rx="11" fill="#eaf1ff"/><circle cx="23" cy="20" r="6" fill="#7cafff"/><path d="M0 50 24 29 43 43 59 24 80 43V64H0" fill="#a7c8ff"/><path d="m0 59 30-28 40 33H0" fill="#4388f7"/></svg><span class="add-dot">+</span></span></button><h2 id="emptyTitle">파일을 놓으면, 시작돼요.</h2><p id="emptySubtitle">Image · PDF · Media</p><button class="pick-button" data-action="open" id="pickLabel">Choose a file</button><div id="landingPresets" class="intent-presets"></div><button class="sample-button" data-action="sample"><span data-i18n="shell.sample">Try a sample</span><span>↗</span></button><div id="featuredIntents" class="featured-intents"></div></div>
<div id="canvasWrap" class="canvas-wrap" hidden><canvas id="preview" aria-label="편집 미리보기" data-i18n-aria="shell.preview"></canvas><div id="cropBox" hidden></div></div><video id="video" controls playsinline preload="metadata" hidden></video><div class="stage-badge" id="stageBadge" hidden></div><div class="drop-overlay" id="dropOverlay" hidden><span data-i18n="shell.drop">Drop it here</span><span>↙</span></div></section><aside id="panel" class="property-panel" aria-label="작업 설정" data-i18n-aria="shell.settings" hidden></aside></div>
<section data-ad-exclude class="result-workspace intent-controls" id="intentControls" aria-label="Tool action and result" data-i18n-aria="shell.intentControls" hidden></section>
<div id="fileStrip" class="file-strip" aria-label="파일과 페이지 목록" data-i18n-aria="shell.files" hidden></div>
<footer class="workspace-footer"><div id="toolDock" class="tool-dock" aria-label="현재 편집 도구" data-i18n-aria="shell.tools"></div><div id="documentInfo" class="document-info" data-i18n="원본은 그대로, 작업은 내 기기에서.">Originals untouched. Processing on your device.</div></footer></main></div>
<div class="bottom-line"><span data-i18n="shell.tagline">ONE FILE. MORE POSSIBILITIES.</span><button data-action="privacy" data-i18n="shell.privacy">Privacy &amp; limits</button><span>v1.3</span></div>
<div id="siteContent"><!--site-content--></div>
<div id="message" class="message" role="alert" hidden></div><div id="progress" class="progress-card" role="status" hidden><span class="spinner"></span><span id="progressText" data-i18n="shell.working">Working…</span><button class="icon-button" data-action="cancel" aria-label="작업 취소" data-i18n-aria="shell.cancel">✕</button></div>
<div id="tooltip" class="tooltip" role="tooltip" hidden></div>
<input id="fileInput" type="file" multiple hidden><input id="overlayInput" type="file" accept="image/png,image/jpeg,image/webp" hidden>
<dialog data-ad-exclude id="helpDialog"><div class="dialog-heading"><h2 id="dialogTitle" data-i18n="필요한 것만, 간단하게.">Just what you need.</h2><button class="icon-button" data-action="close-dialog" aria-label="닫기" data-i18n-aria="shell.close">✕</button></div><div id="dialogBody"></div></dialog>
</body></html>
