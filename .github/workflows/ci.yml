name: Nerulio validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium firefox
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Full syntax, unit, build and real HTTP regression
        run: python tools/regression.py
      - name: Service layer end-to-end (wrangler pages dev + local D1, no production resources)
        run: python tests/service-browser.py
      - name: Decoded image quality and PDF preservation benchmarks
        run: |
          npm run benchmark
          python tools/benchmark.py --pdf
      - name: Archive the exact tested source
        if: always()
        run: git archive --format=tar --output=source.tar HEAD
      - name: Upload reproducible validation inputs and site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fileforge-validation-${{ github.sha }}
          path: |
            source.tar
            dist/
            test-results/
          retention-days: 7
