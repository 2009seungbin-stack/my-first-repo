# Operator-only config for D1 migrations. It is NOT the Pages project configuration:
# there is intentionally no wrangler.toml at the repository root, so the Pages dashboard
# stays authoritative for bindings, variables and secrets.
#
#   npx wrangler d1 migrations list  nerulio-preview --remote --config ops/d1.wrangler.toml
#   npx wrangler d1 migrations apply nerulio-preview --remote --config ops/d1.wrangler.toml
#   npx wrangler d1 migrations apply nerulio-prod    --remote --config ops/d1.wrangler.toml
#
# Fill in the database_id values printed by `wrangler d1 create`. They are identifiers,
# not secrets. Never point automated tests at these databases.
name = "nerulio-d1-ops"

[[d1_databases]]
binding = "DB"
database_name = "nerulio-prod"
database_id = "bc890e90-fca6-4837-82ad-0574c2378293"
migrations_dir = "../migrations"

[[d1_databases]]
binding = "DB_PREVIEW"
database_name = "nerulio-preview"
database_id = "d9554f4a-6cbe-4ffc-af39-880ce61152ef"
migrations_dir = "../migrations"
